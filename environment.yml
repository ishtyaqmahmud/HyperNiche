name: hyperniche

channels:
  - pytorch
  - pyg
  - conda-forge
  - defaults

dependencies:
  - python=3.10

  # Core scientific packages
  - numpy=1.26.4
  - scipy=1.10.1
  - pandas=1.5.3
  - scikit-learn=1.3.2

  # Visualization
  - matplotlib=3.10.9
  - seaborn=0.13.2

  # Single-cell analysis
  - anndata=0.11.4
  - scanpy=1.11.5
  - h5py=3.15.1

  # Graph libraries
  - networkx=3.4.2
  - python-igraph=0.11.8
  - leidenalg=0.10.2

  # Utilities
  - pyyaml=6.0.2
  - tqdm=4.67.1
  - joblib

  - pip

  - pip:
      - torch==2.7.0
      - torch-geometric==2.6.1
      - torch-scatter==2.1.2
      - torch-sparse==0.6.18
